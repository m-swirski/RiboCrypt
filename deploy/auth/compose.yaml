services:
  postgres:
    image: ${POSTGRES_IMAGE:?Choose a pinned PostgreSQL image}
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set the database password}
    volumes:
      - identity-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 10
  keycloak:
    image: ${KEYCLOAK_IMAGE:?Choose a pinned Keycloak image}
    restart: unless-stopped
    command: ["start", "--import-realm"]
    ports:
      - "127.0.0.1:8180:8080"
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set the database password}
      KC_HOSTNAME: https://${LOGIN_HOST:?Set the login hostname}
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?Set the administrator name}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set the administrator password}
      RIBOCRYPT_APP_HOST: ${APP_HOST:?Set the app hostname}
      RIBOCRYPT_OIDC_CLIENT_SECRET: ${RIBOCRYPT_OIDC_CLIENT_SECRET:?Set the OIDC secret}
    volumes:
      - ./realm.json:/opt/keycloak/data/import/ribocrypt-realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy
  oauth2-proxy:
    image: ${OAUTH2_PROXY_IMAGE:?Choose a pinned OAuth2 Proxy image}
    restart: unless-stopped
    command: ["--config=/etc/oauth2-proxy.cfg"]
    ports:
      - "127.0.0.1:4180:4180"
    environment:
      OAUTH2_PROXY_OIDC_ISSUER_URL: https://${LOGIN_HOST:?Set the login hostname}/realms/ribocrypt
      OAUTH2_PROXY_REDIRECT_URL: https://${APP_HOST:?Set the app hostname}/oauth2/callback
      OAUTH2_PROXY_CLIENT_SECRET: ${RIBOCRYPT_OIDC_CLIENT_SECRET:?Set the OIDC secret}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET:?Set the cookie secret}
      OAUTH2_PROXY_BACKEND_LOGOUT_URL: https://${LOGIN_HOST:?Set the login hostname}/realms/ribocrypt/protocol/openid-connect/logout?id_token_hint={id_token}
    volumes:
      - ./oauth2-proxy.cfg:/etc/oauth2-proxy.cfg:ro
volumes:
  identity-db:
